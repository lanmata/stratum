  /api/v1/profile/image/application/{applicationId}:
    post:
      tags: ["profile-image"]
      operationId: "uploadProfileImage"
      summary: "Upload profile image"
      description: "Uploads a profile image for the user identified by the session-token header."
      security:
        - sessionToken: []
      parameters:
        - name: "session-token"
          in: "header"
          required: true
          schema:
            type: "string"
        - name: "applicationId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: "object"
              required: ["image"]
              properties:
                image:
                  type: "string"
                  format: "binary"
      responses:
        "201":
          description: "Image uploaded successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostProfileImageResponse"
        "400":
          description: "Invalid input"
        "500":
          description: "Server error"

