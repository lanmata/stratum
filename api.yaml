    # ── Managed Clients ──────────────────────────────────────────────────────

    ManagedClientCreateRequest:
      type: object
      required: [name, applicationId, scopes]
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 512
        applicationId:
          type: string
          format: uuid
        scopes:
          type: array
          items:
            type: string
          minItems: 1
        active:
          type: boolean
          default: true

    ManagedClientCreateResponse:
      type: object
      properties:
        clientId:
          type: string
          format: uuid
        clientSecret:
          type: string
          description: Plaintext secret — returned exactly once. Store immediately and securely.
        name:
          type: string
        applicationId:
          type: string
          format: uuid
        scopes:
          type: array
          items:
            type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ManagedClientTO:
      type: object
      description: Read-only view of a managed client. Never contains secret material.
      properties:
        clientId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        applicationId:
          type: string
          format: uuid
        scopes:
          type: array
          items:
            type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastUpdatedAt:
          type: string
          format: date-time
        secretLastRotatedAt:
          type: string
          format: date-time

    ManagedClientUpdateRequest:
      type: object
      description: All fields optional — only provided fields are updated.
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 512
        scopes:
          type: array
          items:
            type: string
        active:
          type: boolean

    ManagedClientTokenRequest:
      type: object
      required: [clientId, clientSecret, scopes]
      properties:
        clientId:
          type: string
          format: uuid
        clientSecret:
          type: string
        scopes:
          type: array
          items:
            type: string
          minItems: 1

    ManagedClientTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: Signed RS256 M2M JWT
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Token TTL in seconds
        scopes:
          type: array
          items:
            type: string
        issuedAt:
          type: string
          format: date-time

    ManagedClientSecretRotateResponse:
      type: object
      properties:
        clientId:
          type: string
          format: uuid
        clientSecret:
          type: string
          description: New plaintext secret — returned exactly once. Store immediately and securely.
        gracePeriodSeconds:
          type: integer
          description: Seconds the old secret remains valid
        rotatedAt:
          type: string
          format: date-time

    ManagedClientTokenIntrospectResponse:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
        clientId:
          type: string
        clientName:
          type: string
        scopes:
          type: array
          items:
            type: string
        issuer:
          type: string
        exp:
          type: integer
          format: int64
        iat:
          type: integer
          format: int64
        jti:
          type: string

    ManagedClientErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: invalid_client
        errorDescription:
          type: string
        clientId:
          type: string
