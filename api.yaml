  # ── IAM — Audit ───────────────────────────────────────────────────────────────

  /api/v1/iam/audit/events:
    get:
      tags: ["iam-audit"]
      operationId: "getAuditEvents"
      summary: "Query audit events"
      description: "Returns a paginated list of security audit events."
      parameters:
        - name: "userId"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "uuid"
        - name: "applicationId"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "uuid"
        - name: "eventType"
          in: "query"
          required: false
          schema:
            $ref: "#/components/schemas/AuditEventType"
        - name: "from"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "to"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "page"
          in: "query"
          required: false
          schema:
            type: "integer"
            format: "int32"
            default: 0
            minimum: 0
        - name: "size"
          in: "query"
          required: false
          schema:
            type: "integer"
            format: "int32"
            default: 20
            minimum: 1
      responses:
        "200":
          description: "Audit events returned"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/AuditEventTO"
        "204":
          description: "No events match filters"
        "400":
          description: "Invalid query parameter"
        "401":
          description: "Missing or invalid bearer token"

