  /api/v1/notices/person/{personId}:
    get:
      tags: ["notices"]
      operationId: "listNoticesByPerson"
      summary: "List notices by person"
      parameters:
        - name: "personId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "Notice list returned"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Notice"
        "404":
          description: "Person not found"

  # ── IAM — Audit ───────────────────────────────────────────────────────────────

  /api/v1/iam/audit/events:
    get:
      tags: ["iam-audit"]
      operationId: "getAuditEvents"
      summary: "Query audit events"
      description: "Returns a paginated list of security audit events."
      parameters:
        - name: "userId"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "uuid"
        - name: "applicationId"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "uuid"
        - name: "eventType"
          in: "query"
          required: false
          schema:
            $ref: "#/components/schemas/AuditEventType"
        - name: "from"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "to"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "page"
          in: "query"
          required: false
          schema:
            type: "integer"
            format: "int32"
            default: 0
            minimum: 0
        - name: "size"
          in: "query"
          required: false
          schema:
            type: "integer"
            format: "int32"
            default: 20
            minimum: 1
      responses:
        "200":
          description: "Audit events returned"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/AuditEventTO"
        "204":
          description: "No events match filters"
        "400":
          description: "Invalid query parameter"
        "401":
          description: "Missing or invalid bearer token"

  # ── IAM — Token Introspection ─────────────────────────────────────────────────

  /api/v1/iam/tokens/introspect:
    post:
      tags: ["iam-tokens"]
      operationId: "introspectToken"
      summary: "Introspect token"
      description: "Decodes and validates a session-token JWT. Returns active=false for invalid/expired tokens."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenIntrospectRequest"
      responses:
        "200":
          description: "Introspection result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenIntrospectResponse"
        "400":
          description: "Token is blank or missing"

  # ── IAM — Permission Check ────────────────────────────────────────────────────

  /api/v1/iam/permissions/check:
    post:
      tags: ["iam-permissions"]
      operationId: "checkPermission"
      summary: "Check permission"
      description: "Validates a session token and checks whether it carries the requested permission."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionCheckRequest"
      responses:
        "200":
          description: "Permission check result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionCheckResponse"
        "400":
          description: "Missing or malformed payload"
        "401":
          description: "Invalid or expired session token"

  # ── Report (legacy) ───────────────────────────────────────────────────────────

  /api/v1/report/template:
    get:
      tags: ["report"]
      operationId: "createWordDocument"
      summary: "Generate document from template"
      parameters:
        - name: "values"
          in: "query"
          required: true
          schema:
            type: "string"
        - name: "documentTemplate"
          in: "query"
          required: true
          schema:
            type: "string"
            format: "binary"
      responses:
        "200":
          description: "Document generated"
          content:
            application/octet-stream:
              schema:
                type: "string"
                format: "binary"

  /api/v1/report/placeholdervalues:
    get:
      tags: ["report"]
      operationId: "placeholderValues"
      summary: "Get template placeholder values"
      parameters:
        - name: "templateDocumentModel"
          in: "query"
          required: true
          schema:
            $ref: "#/components/schemas/TemplateDocumentModel"
        - name: "documentTemplate"
          in: "query"
          required: true
          schema:
            type: "string"
            format: "binary"
      responses:
        "200":
          description: "Placeholder list returned"
          content:
            application/octet-stream:
              schema:
                type: "array"
                items:
                  type: "string"

  # ── Managed Clients ──────────────────────────────────────────────────────────

  /api/v1/managed-clients:
    post:
      tags: [managed-clients]
      summary: Register a new managed client
      description: Returns the clientSecret exactly once in the response body.
      operationId: registerManagedClient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedClientCreateRequest'
      responses:
        '201':
          description: Client registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedClientCreateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedClientErrorResponse'
        '409':
          description: Duplicate client name for application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedClientErrorResponse'
    get:
      tags: [managed-clients]
      summary: List managed clients
      operationId: listManagedClients
      security:
        - bearerAuth: []
      parameters:
        - name: applicationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: active
          in: query
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Client list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManagedClientTO'
        '204':
          description: No clients found

  /api/v1/managed-clients/token:
    post:
      tags: [managed-clients]
      summary: Issue an M2M access token
      description: Public endpoint. Validates clientId, clientSecret, and requested scopes.
      operationId: issueManagedClientToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedClientTokenRequest'
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedClientTokenResponse'
        '400':
          description: Invalid scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedClientErrorResponse'
        '401':
          description: Invalid credentials or inactive client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedClientErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedClientErrorResponse'

  /api/v1/managed-clients/introspect:
    post:
      tags: [managed-clients]
      summary: Introspect an M2M access token
      description: Public endpoint. Always returns HTTP 200. active=false for invalid, expired, or revoked tokens.
      operationId: introspectManagedClientToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: The raw M2M access token to introspect
      responses:
        '200':
          description: Introspection result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedClientTokenIntrospectResponse'

  /api/v1/managed-clients/{clientId}:
    get:
      tags: [managed-clients]
      summary: Get a managed client by ID
      operationId: getManagedClient
      security:
        - bearerAuth: []
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Client found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedClientTO'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedClientErrorResponse'
    put:
      tags: [managed-clients]
      summary: Update a managed client
      operationId: updateManagedClient
      security:
        - bearerAuth: []
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedClientUpdateRequest'
      responses:
        '200':
          description: Client updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedClientTO'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedClientErrorResponse'
    delete:
      tags: [managed-clients]
      summary: Delete a managed client
      description: Revokes all active tokens before deletion.
      operationId: deleteManagedClient
      security:
        - bearerAuth: []
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Client deleted
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedClientErrorResponse'

  /api/v1/managed-clients/{clientId}/rotate-secret:
    post:
      tags: [managed-clients]
      summary: Rotate the secret for a managed client
      description: Returns the new plaintext clientSecret once. Grace period allows the old secret temporarily.
      operationId: rotateManagedClientSecret
      security:
        - bearerAuth: []
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Secret rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedClientSecretRotateResponse'
        '404':
          description: Client not found or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedClientErrorResponse'

  /api/v1/managed-clients/{clientId}/tokens:
    delete:
      tags: [managed-clients]
      summary: Revoke all active tokens for a client
      operationId: revokeAllClientTokens
      security:
        - bearerAuth: []
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: All tokens revoked
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedClientErrorResponse'

# ── Components ──────────────────────────────────────────────────────────────────

components:

  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "Standard Bearer JWT token in the Authorization header"
    sessionToken:
      type: "apiKey"
      in: "header"
      name: "session-token"
      description: "Session JWT issued by the backbone-rest session service"

  schemas:

    # ── Session ─────────────────────────────────────────────────────────────

    SessionRequest:
      type: "object"
      description: "Request body for alias+password session creation"
      required: ["alias", "password", "applicationId"]
      properties:
        alias:
          type: "string"
        password:
          type: "string"
          format: "password"
        applicationId:
          type: "string"
          format: "uuid"
          description: "Target application context for the session"

    SessionEmailRequest:
      type: "object"
      description: "Request body for email+password session creation"
      required: ["email", "password", "applicationId"]
      properties:
        email:
          type: "string"
          format: "email"
        password:
          type: "string"
          format: "password"
        applicationId:
          type: "string"
          format: "uuid"

    SessionRefreshRequest:
      type: "object"
      description: "Request body to exchange a refresh token for new tokens"
      required: ["refreshToken"]
      properties:
        refreshToken:
          type: "string"

    SessionResponse:
      type: "object"
      description: "JWT access token (and optional refresh token)"
      properties:
        token:
          type: ["string", "null"]
        refreshToken:
          type: ["string", "null"]

    # ── IAM ─────────────────────────────────────────────────────────────────

    AuditEventType:
      type: "string"
      enum:
        - "LOGIN_SUCCESS"
        - "LOGIN_FAILURE"
        - "PASSWORD_CHANGE"
        - "ROLE_ASSIGNED"
        - "ROLE_REVOKED"
        - "LOGOUT"
        - "ACCOUNT_LOCKED"
        - "ACCOUNT_UNLOCKED"
        - "TOKEN_REFRESH"
        - "PASSWORD_RESET_REQUEST"
        - "CLIENT_REGISTERED"
        - "CLIENT_UPDATED"
        - "CLIENT_DEACTIVATED"
        - "CLIENT_DELETED"
        - "CLIENT_SECRET_ROTATED"
        - "CLIENT_TOKEN_ISSUED"
        - "CLIENT_TOKEN_ISSUE_FAILED"
        - "CLIENT_TOKEN_REVOKED"
        - "CLIENT_INTROSPECTION_CALLED"

    AuditEventTO:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        userId:
          type: "string"
          format: "uuid"
        applicationId:
          type: ["string", "null"]
          format: "uuid"
        eventType:
          $ref: "#/components/schemas/AuditEventType"
        ipAddress:
          type: ["string", "null"]
        userAgent:
          type: ["string", "null"]
        occurredAt:
          type: "string"
          format: "date-time"
        details:
          type: ["string", "null"]
        createdAt:
          type: "string"
          format: "date-time"

    TokenIntrospectRequest:
      type: "object"
      required: ["token"]
      properties:
        token:
          type: "string"

    TokenIntrospectResponse:
      type: "object"
      properties:
        active:
          type: "boolean"
        subject:
          type: ["string", "null"]
        issuer:
          type: ["string", "null"]
        audience:
          type: ["string", "null"]
        expiresAt:
          type: "integer"
          format: "int64"
        issuedAt:
          type: "integer"
          format: "int64"
        tokenType:
          type: ["string", "null"]
        roles:
          type: "array"
          items:
            type: "string"

    PermissionCheckRequest:
      type: "object"
      required: ["permission", "sessionToken"]
      properties:
        permission:
          type: "string"
        applicationId:
          type: ["string", "null"]
          format: "uuid"
        sessionToken:
          type: "string"

    PermissionCheckResponse:
      type: "object"
      properties:
        granted:
          type: "boolean"
        permission:
          type: "string"
        reason:
          type: ["string", "null"]

    # ── Profile Image ────────────────────────────────────────────────────────

    PostProfileImageResponse:
      type: "object"
      properties:
        ref:
          type: "string"

    GetProfileImageReferenceResponse:
      type: "object"
      properties:
        ref:
          type: "string"

    # ── Domain ───────────────────────────────────────────────────────────────

    ContactType:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        description:
          type: ["string", "null"]
        active:
          type: "boolean"

    ContactTypeRequest:
      type: "object"
      properties:
        contactType:
          $ref: "#/components/schemas/ContactType"
        dateTime:
          type: ["string", "null"]
          format: "date-time"
        appName:
          type: ["string", "null"]
        appToken:
          type: ["string", "null"]

    Person:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        firstName:
          type: "string"
        middleName:
          type: ["string", "null"]
        lastName:
          type: "string"
        gender:
          type: ["string", "null"]
        birthdate:
          type: ["string", "null"]
          format: "date"

    PersonRequest:
      type: "object"
      properties:
        person:
          $ref: "#/components/schemas/Person"
        dateTime:
          type: ["string", "null"]
          format: "date-time"
        appName:
          type: ["string", "null"]
        appToken:
          type: ["string", "null"]

    Address:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        personId:
          type: "string"
          format: "uuid"
        address:
          type: "string"
        zipcode:
          type: ["string", "null"]

    AddressRequest:
      type: "object"
      properties:
        address:
          $ref: "#/components/schemas/Address"
        dateTime:
          type: ["string", "null"]
          format: "date-time"
        appName:
          type: ["string", "null"]
        appToken:
          type: ["string", "null"]

    IdentificationDocument:
      type: "object"
      description: |
        Catalog of identification-document TYPES (e.g. "Cédula de Ciudadanía",
        "Pasaporte") shared across multiple people — per business rules 11/12
        (a person has one document type; a document type can be held by many
        people). Not a per-person document instance/number. Confirm this
        interpretation with the backbone-rest team before implementation.
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        description:
          type: ["string", "null"]
        active:
          type: "boolean"

    IdentificationDocumentRequest:
      type: "object"
      properties:
        identificationDocument:
          $ref: "#/components/schemas/IdentificationDocument"
        dateTime:
          type: ["string", "null"]
          format: "date-time"
        appName:
          type: ["string", "null"]
        appToken:
          type: ["string", "null"]

    Contact:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        content:
          type: "string"
        contactType:
          $ref: "#/components/schemas/ContactType"
        person:
          $ref: "#/components/schemas/Person"
        active:
          type: "boolean"

    Feature:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        description:
          type: ["string", "null"]
        active:
          type: "boolean"

    FeatureRequest:
      type: "object"
      properties:
        feature:
          $ref: "#/components/schemas/Feature"
        dateTime:
          type: ["string", "null"]
          format: "date-time"
        appName:
          type: ["string", "null"]
        appToken:
          type: ["string", "null"]

    Role:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        description:
          type: ["string", "null"]
        features:
          type: "array"
          items:
            $ref: "#/components/schemas/Feature"
        active:
          type: "boolean"

    RoleRequest:
      type: "object"
      properties:
        role:
          $ref: "#/components/schemas/Role"
        dateTime:
          type: ["string", "null"]
          format: "date-time"
        appName:
          type: ["string", "null"]
        appToken:
          type: ["string", "null"]

    RoleFeature:
      type: "object"
      description: |
        Join role+feature carrying its own assignment-level `active` flag,
        distinct from Feature.active (the feature's own status). Complements
        the existing embedded Role.features array.
      properties:
        id:
          type: "string"
          format: "uuid"
        roleId:
          type: "string"
          format: "uuid"
        featureId:
          type: "string"
          format: "uuid"
        active:
          type: "boolean"

    RoleFeatureRequest:
      type: "object"
      properties:
        roleFeature:
          $ref: "#/components/schemas/RoleFeature"
        dateTime:
          type: ["string", "null"]
          format: "date-time"
        appName:
          type: ["string", "null"]
        appToken:
          type: ["string", "null"]

    Application:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        description:
          type: ["string", "null"]
        active:
          type: "boolean"
        createdDate:
          type: ["string", "null"]
          format: "date-time"
        lastUpdate:
          type: ["string", "null"]
          format: "date-time"
        serviceTypeId:
          type: ["string", "null"]
          format: "uuid"
        userList:
          type: "array"
          items:
            $ref: "#/components/schemas/User"
        roleList:
          type: "array"
          items:
            $ref: "#/components/schemas/Role"

    ApplicationCreateRequest:
      type: "object"
      properties:
        application:
          $ref: "#/components/schemas/Application"
        dateTime:
          type: ["string", "null"]
          format: "date-time"
        appName:
          type: ["string", "null"]
        appToken:
          type: ["string", "null"]

    ApplicationRoleUser:
      type: "object"
      description: |
        Ternary join application+role+user (business rules 1-4). Forward-looking —
        does not replace the existing non-app-scoped
        PUT /api/v1/users/link/user/{userId}/role/{roleId} /
        PUT /api/v1/users/unlink/user/{userId}/role/{roleId} endpoints.
      properties:
        id:
          type: "string"
          format: "uuid"
        applicationId:
          type: "string"
          format: "uuid"
        roleId:
          type: "string"
          format: "uuid"
        userId:
          type: "string"
          format: "uuid"
        active:
          type: "boolean"
        profileImageRef:
          type: ["string", "null"]

    ApplicationRoleUserRequest:
      type: "object"
      properties:
        applicationRoleUser:
          $ref: "#/components/schemas/ApplicationRoleUser"
        dateTime:
          type: ["string", "null"]
          format: "date-time"
        appName:
          type: ["string", "null"]
        appToken:
          type: ["string", "null"]

    User:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        alias:
          type: "string"
        password:
          type: ["string", "null"]
          format: "password"
        email:
          type: ["string", "null"]
          format: "email"
        active:
          type: "boolean"
        person:
          $ref: "#/components/schemas/Person"
        roles:
          type: "array"
          items:
            $ref: "#/components/schemas/Role"
        applications:
          type: "array"
          items:
            $ref: "#/components/schemas/Application"

    # ── User API DTOs ────────────────────────────────────────────────────────

    UserTO:
      type: "object"
      description: "Full user transfer object returned by the User API"
      properties:
        id:
          type: "string"
          format: "uuid"
        alias:
          type: "string"
        password:
          type: ["string", "null"]
          format: "password"
        email:
          type: ["string", "null"]
          format: "email"
        displayName:
          type: ["string", "null"]
        createdDate:
          type: ["string", "null"]
          format: "date-time"
        lastUpdate:
          type: ["string", "null"]
          format: "date-time"
        active:
          type: "boolean"
        notificationEmail:
          type: ["boolean", "null"]
        notificationSms:
          type: ["boolean", "null"]
        privacyDataOutActive:
          type: ["boolean", "null"]
        person:
          $ref: "#/components/schemas/Person"
        roles:
          type: "array"
          items:
            $ref: "#/components/schemas/Role"
        applications:
          type: "array"
          items:
            $ref: "#/components/schemas/Application"

    UserCreateRequest:
      type: "object"
      description: "Request payload for creating a new user"
      required: ["alias", "displayName", "password", "email", "person", "roleId", "applicationId"]
      properties:
        id:
          type: ["string", "null"]
          format: "uuid"
        alias:
          type: "string"
        displayName:
          type: "string"
        password:
          type: "string"
          format: "password"
        email:
          type: "string"
          format: "email"
        notificationEmail:
          type: "boolean"
          default: false
        notificationSms:
          type: "boolean"
          default: false
        privacyDataOutActive:
          type: "boolean"
          default: false
        active:
          type: "boolean"
          default: true
        person:
          $ref: "#/components/schemas/Person"
        roleId:
          type: "string"
          format: "uuid"
        applicationId:
          type: "string"
          format: "uuid"

    UserCreateResponse:
      type: "object"
      description: "Response returned after successfully creating a user"
      properties:
        id:
          type: "string"
          format: "uuid"
        alias:
          type: "string"
        email:
          type: "string"
          format: "email"
        displayName:
          type: ["string", "null"]
        createdDate:
          type: ["string", "null"]
          format: "date-time"
        lastUpdate:
          type: ["string", "null"]
          format: "date-time"
        notificationEmail:
          type: ["boolean", "null"]
        notificationSms:
          type: ["boolean", "null"]
        privacyDataOutActive:
          type: ["boolean", "null"]
        active:
          type: "boolean"
        personId:
          type: ["string", "null"]
          format: "uuid"
        roleId:
          type: ["string", "null"]
          format: "uuid"
        applicationId:
          type: ["string", "null"]
          format: "uuid"

    UserAliasTO:
      type: "object"
      description: "Compact user projection exposing alias and assigned roles"
      properties:
        userId:
          type: "string"
          format: "uuid"
        alias:
          type: "string"
        firstname:
          type: ["string", "null"]
        lastname:
          type: ["string", "null"]
        roles:
          type: "array"
          items:
            type: "string"
            format: "uuid"

    PutUserUpdateRequest:
      type: "object"
      description: "Partial-update request — only non-null fields are applied"
      required: ["application"]
      properties:
        application:
          type: "string"
          format: "uuid"
        password:
          type: ["string", "null"]
          format: "password"
        displayName:
          type: ["string", "null"]
        active:
          type: ["boolean", "null"]
        notificationEmail:
          type: ["boolean", "null"]
        notificationSms:
          type: ["boolean", "null"]
        privacyDataOutActive:
          type: ["boolean", "null"]
        firstName:
          type: ["string", "null"]
        middleName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        gender:
          type: ["string", "null"]
        birthdate:
          type: ["string", "null"]
          format: "date"
        contacts:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/PutUserUpdateContact"
        roleIds:
          type: ["array", "null"]
