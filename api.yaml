openapi: 3.1.0
info:
  title: Backbone REST API
  description: backbone-rest Backoffice REST Service. All endpoints under /api/v1/*
    require a valid JWT unless the operation declares no security requirement.
  version: 0.0.3
servers:
- url: https://localhost:8084
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: identification-documents
  description: Identification document management
- name: iam-permissions
  description: IAM Permission Check API
- name: users
  description: The user API
- name: service-type
  description: The service type API
- name: features
  description: Feature flag management
- name: people
  description: Person management
- name: session
  description: The Session API
- name: managed-clients
  description: Management Client Authentication Manager — M2M credential lifecycle
- name: report
  description: Word document template processing
- name: applications
  description: Application (service) management
- name: iam-audit
  description: IAM Audit Event API
- name: notices
  description: The notice API
- name: addresses
  description: Address management
- name: contact-types
  description: Contact type management
- name: contacts
  description: Contact management
- name: profile-image
  description: User profile image management
- name: roles
  description: Role management
- name: notice-types
  description: The notice type API
- name: iam-audit-reports
  description: Usage and access reports
- name: iam-tokens
  description: IAM Token Introspection API
paths:
  /api/v1/users/{userId}:
    put:
      tags:
      - users
      description: "Partial update of user details including firstName, lastName,\
        \ middleName, displayName, gender, birthdate, and phone numbers (contacts).\
        \ Only provided fields will be updated."
      operationId: putUserDetail
      parameters:
      - name: userId
        in: path
        description: User ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutUserUpdateRequest"
        required: true
      responses:
        "202":
          description: User updated and accepted
        "406":
          description: User update rejected
  /api/v1/users/{userId}/full-detail:
    put:
      tags:
      - users
      description: Update a user
      operationId: update
      parameters:
      - name: userId
        in: path
        description: User ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserTO"
        required: true
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTO"
        "400":
          description: Invalid user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTO"
  /api/v1/users/unlink/user/{userId}/role/{roleId}:
    put:
      tags:
      - users
      description: Unlinks a role from a user
      operationId: unlink
      parameters:
      - name: userId
        in: path
        description: User ID
        required: true
        schema:
          type: string
          format: uuid
      - name: roleId
        in: path
        description: Role ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Role unlinked from user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTO"
  /api/v1/users/link/user/{userId}/role/{roleId}:
    put:
      tags:
      - users
      description: Links a role to a user
      operationId: link
      parameters:
      - name: userId
        in: path
        description: User ID
        required: true
        schema:
          type: string
          format: uuid
      - name: roleId
        in: path
        description: Role ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Role linked to user (also when it was already linked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTO"
        "409":
          description: The database rejected the link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTO"
  /api/v1/users/application/{applicationId}/user/{userId}/activate:
    put:
      tags:
      - users
      description: Activates a user of an application so that it can sign in. Idempotent.
      operationId: activateUser
      parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: User is active
        "404":
          description: User not found in the application
        "403":
          description: Managed client without the users:manage scope or of another
            application
  /api/v1/service-types/{serviceTypeId}:
    put:
      tags:
      - service-type
      summary: Update a service type
      description: Updates an existing service type by its UUID.
      operationId: update_1
      parameters:
      - name: serviceTypeId
        in: path
        description: Service type UUID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceTypeRequest"
        required: true
      responses:
        "202":
          description: Service type updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceType"
        "404":
          description: Service type not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceType"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceType"
  /api/v1/roles/{roleId}:
    put:
      tags:
      - roles
      description: Update a role
      operationId: update_2
      parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          description: Name or description out of limits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "409":
          description: Role name previously exist in the application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
  /api/v1/people/{personId}:
    get:
      tags:
      - people
      summary: Fetch person by ID
      description: Return a person.
      operationId: find
      parameters:
      - name: personId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "404":
          description: Person not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
    put:
      tags:
      - people
      summary: Update a person
      description: Update and return the person.
      operationId: update_3
      parameters:
      - name: personId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonRequest"
        required: true
      responses:
        "200":
          description: Person updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          description: Person not founded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
  /api/v1/notice-types/{noticeTypeId}:
    get:
      tags:
      - notice-types
      summary: Find notice type by ID
      description: Returns a single notice type by its UUID.
      operationId: findNoticeTypeById
      parameters:
      - name: noticeTypeId
        in: path
        description: Notice type UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Notice type found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeType"
        "404":
          description: Notice type not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeType"
    put:
      tags:
      - notice-types
      summary: Update a notice type
      description: Updates an existing notice type by its UUID.
      operationId: updateNoticeType
      parameters:
      - name: noticeTypeId
        in: path
        description: Notice type UUID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoticeTypeRequest"
        required: true
      responses:
        "200":
          description: Notice type updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeType"
        "404":
          description: Notice type not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeType"
    delete:
      tags:
      - notice-types
      summary: Delete a notice type
      description: Deletes the notice type identified by the given UUID.
      operationId: deleteNoticeType
      parameters:
      - name: noticeTypeId
        in: path
        description: Notice type UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Notice type deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeType"
        "404":
          description: Notice type not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeType"
  /api/v1/managed-clients/{clientId}:
    get:
      tags:
      - managed-clients
      summary: Get a managed client by ID
      operationId: getManagedClient
      parameters:
      - name: clientId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Client found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedClientTO"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedClientErrorResponse"
    put:
      tags:
      - managed-clients
      summary: Update a managed client
      operationId: updateManagedClient
      parameters:
      - name: clientId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedClientUpdateRequest"
        required: true
      responses:
        "200":
          description: Client updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedClientTO"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedClientErrorResponse"
    delete:
      tags:
      - managed-clients
      summary: Delete a managed client
      operationId: deleteManagedClient
      parameters:
      - name: clientId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Client deleted
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedClientErrorResponse"
  /api/v1/identification-documents/{identificationDocumentId}:
    get:
      tags:
      - identification-documents
      summary: Find identification document by ID
      description: Returns a single identification document by its UUID.
      operationId: findIdentificationDocumentById
      parameters:
      - name: identificationDocumentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Identification document found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentificationDocument"
        "404":
          description: Identification document not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentificationDocument"
    put:
      tags:
      - identification-documents
      summary: Update an identification document
      description: Updates an existing identification document by its UUID.
      operationId: updateIdentificationDocument
      parameters:
      - name: identificationDocumentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentificationDocumentRequest"
        required: true
      responses:
        "200":
          description: Identification document updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentificationDocument"
        "404":
          description: Identification document not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentificationDocument"
    delete:
      tags:
      - identification-documents
      summary: Delete an identification document
      description: Deletes the identification document identified by the given UUID.
      operationId: deleteIdentificationDocument
      parameters:
      - name: identificationDocumentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Identification document deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentificationDocument"
        "404":
          description: Identification document not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentificationDocument"
  /api/v1/features/{featureId}:
    put:
      tags:
      - features
      description: Update a Feature
      operationId: update_4
      parameters:
      - name: featureId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureRequest"
        required: true
      responses:
        "202":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feature"
        "406":
          description: Feature not registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feature"
  /api/v1/contacts/{contactId}:
    get:
      tags:
      - contacts
      description: Find a contact list.
      operationId: find_1
      parameters:
      - name: contactId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
    put:
      tags:
      - contacts
      description: Update a contact.
      operationId: update_5
      parameters:
      - name: contactId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactCreateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
    delete:
      tags:
      - contacts
      description: Delete a contact.
      operationId: delete
      parameters:
      - name: contactId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
  /api/v1/contact-types/{contactTypeId}:
    get:
      tags:
      - contact-types
      description: Find a contact type list.
      operationId: find_2
      parameters:
      - name: contactTypeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactType"
    put:
      tags:
      - contact-types
      description: Find a contact type list.
      operationId: update_6
      parameters:
      - name: contactTypeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactType"
        required: true
      responses:
        "200":
          description: Contact Type updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactType"
        "404":
          description: Contact Type not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactType"
        "400":
          description: Contact Type couldn't be updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactType"
    delete:
      tags:
      - contact-types
      description: Delete a contact type.
      operationId: delete_1
      parameters:
      - name: contactTypeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactType"
  /api/v1/applications/{id}:
    get:
      tags:
      - applications
      summary: Find application by ID
      description: Returns the application matching the given UUID.
      operationId: find_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Application found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Application not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
    put:
      tags:
      - applications
      summary: Update an application
      description: Updates the application identified by the given UUID.
      operationId: update_7
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdateRequest"
        required: true
      responses:
        "200":
          description: Application updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Application not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
    delete:
      tags:
      - applications
      summary: Delete an application
      description: Deletes the application identified by the given UUID.
      operationId: delete_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Application deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Application not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
  /api/v1/addresses/{addressId}:
    get:
      tags:
      - addresses
      summary: Find address by ID
      description: Returns the address matching the given UUID.
      operationId: findAddressById
      parameters:
      - name: addressId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Address found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
        "404":
          description: Address not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
    put:
      tags:
      - addresses
      summary: Update an address
      description: Updates the address identified by the given UUID.
      operationId: updateAddress
      parameters:
      - name: addressId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressRequest"
        required: true
      responses:
        "200":
          description: Address updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
        "404":
          description: Address not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
    delete:
      tags:
      - addresses
      summary: Delete an address
      description: Deletes the address identified by the given UUID.
      operationId: deleteAddress
      parameters:
      - name: addressId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Address deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
        "404":
          description: Address not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
  /api/v1/users:
    post:
      tags:
      - users
      description: Create a new user.
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
        required: true
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCreateResponse"
  /api/v1/session:
    post:
      tags:
      - session
      summary: Generate session token
      description: Generates a session token based on user credentials
      operationId: generateSessionToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
        required: true
      responses:
        "200":
          description: Session token generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "404":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
      security: []
  /api/v1/session/token:
    post:
      tags:
      - session
      summary: Generate session token with email
      description: Generates a session token based on user email credentials
      operationId: generateSessionToken_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionEmailRequest"
        required: true
      responses:
        "200":
          description: Session token generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "404":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
      security: []
  /api/v1/session/refresh:
    post:
      tags:
      - session
      summary: Refresh session token
      description: Exchanges a valid or recently-expired refresh token for a new access
        token and refresh token. Public endpoint — no active session required.
      operationId: refreshSessionToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRefreshRequest"
        required: true
      responses:
        "200":
          description: New access and refresh tokens returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Missing or empty refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: "Invalid token, wrong token type, or beyond the grace period"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "500":
          description: Token generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
      security: []
  /api/v1/session/logout:
    post:
      tags:
      - session
      summary: Logout
      description: "Revokes the session token of the session-token header and, when\
        \ the body carries it, the refresh token of the same user. Both stay on the\
        \ JTI deny-list until they would have expired. Public endpoint: holding the\
        \ token is the proof."
      operationId: logout
      parameters:
      - name: session-token
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRefreshRequest"
      responses:
        "204":
          description: Session revoked
        "400":
          description: "Missing session-token header, or not a token of this service"
      security: []
