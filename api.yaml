openapi: "3.1.0"
info:
  title: "Backbone REST API"
  description: |
    backbone-rest Backoffice REST Service — Java 21 / Spring Boot 4.1.0.
    All endpoints under /api/v1/* require a valid Bearer JWT token unless
    explicitly marked as public (security: []).
  version: "1.0.0"

servers:
  - url: "http://localhost:8080"
    description: "Local development server"

security:
  - bearerAuth: []

tags:
  - name: "session"
    description: "Session management — authentication and token lifecycle"
  - name: "users"
    description: "User management"
  - name: "roles"
    description: "Role management"
  - name: "features"
    description: "Feature flag management"
  - name: "contacts"
    description: "Contact management"
  - name: "contact-types"
    description: "Contact type management"
  - name: "people"
    description: "Person management"
  - name: "applications"
    description: "Application (service) management"
  - name: "addresses"
    description: "Person address management"
  - name: "identification-documents"
    description: "Identification document type catalog"
  - name: "application-role-user"
    description: "Application-scoped user/role assignment (forward-looking; does not replace the existing non-app-scoped role link/unlink endpoints)"
  - name: "role-features"
    description: "Role-to-feature assignment, with per-assignment active flag"
  - name: "notice-types"
    description: "Notice type catalog"
  - name: "notices"
    description: "Notice management"
  - name: "profile-image"
    description: "User profile image management"
  - name: "iam-audit"
    description: "IAM Audit Event API"
  - name: "iam-tokens"
    description: "IAM Token Introspection API"
  - name: "iam-permissions"
    description: "IAM Permission Check API"
  - name: "report"
    description: "Document report generation"
  - name: "managed-clients"
    description: "Management Client Authentication Manager — M2M OAuth2 client credential lifecycle"

paths:

  # ── Session ─────────────────────────────────────────────────────────────────

  /api/v1/session:
    post:
      tags: ["session"]
      operationId: "generateSessionToken"
      summary: "Generate session token (alias + password)"
      description: "Generates a session JWT using the user alias and password. Public endpoint."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
      responses:
        "200":
          description: "Session token generated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: "Invalid credentials"
        "404":
          description: "Invalid request payload"

  /api/v1/session/token:
    post:
      tags: ["session"]
      operationId: "generateSessionTokenByEmail"
      summary: "Generate session token (email + password)"
      description: "Generates a session JWT using email, password, and application ID. Public endpoint."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionEmailRequest"
      responses:
        "200":
          description: "Session token generated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: "Invalid credentials"
        "404":
          description: "Invalid request payload"

  /api/v1/session/validate:
    get:
      tags: ["session"]
      operationId: "validateSessionToken"
      summary: "Validate session token"
      description: "Validates the session JWT supplied in the session-token header."
      security:
        - sessionToken: []
      parameters:
        - name: "session-token"
          in: "header"
          required: true
          description: "The session JWT to validate"
          schema:
            type: "string"
      responses:
        "200":
          description: "Token validation result"
          content:
            application/json:
              schema:
                type: "boolean"
        "401":
          description: "Invalid or expired session token"

  /api/v1/session/renew:
    get:
      tags: ["session"]
      operationId: "renewSessionToken"
      summary: "Renew session token"
      description: "Validates the current session token and issues a fresh one."
      security:
        - sessionToken: []
      parameters:
        - name: "session-token"
          in: "header"
          required: true
          description: "The current session JWT to renew"
          schema:
            type: "string"
      responses:
        "200":
          description: "Session token renewed successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: "Token is required"
        "401":
          description: "Invalid or expired session token"
        "404":
          description: "User not found"
        "500":
          description: "Token generation failed"

  /api/v1/session/refresh:
    post:
      tags: ["session"]
      operationId: "refreshSessionToken"
      summary: "Refresh session token"
      description: "Exchanges a refresh token for a new access token and refresh token. Public endpoint."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRefreshRequest"
      responses:
        "200":
          description: "New access and refresh tokens returned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: "Missing or empty refresh token"
        "401":
          description: "Invalid or expired token"
        "500":
          description: "Token generation failed"

  # ── Users ────────────────────────────────────────────────────────────────────

  /api/v1/users:
    post:
      tags: ["users"]
      operationId: "createUser"
      summary: "Create a new user"
      description: "Creates a new user account and returns the created user details."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "201":
          description: "User created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCreateResponse"
        "400":
          description: "Invalid request body"
        "409":
          description: "Alias or email already exists in the application"

  /api/v1/users/check/alias/{alias}/application/{applicationId}:
    get:
      tags: ["users"]
      operationId: "checkAliasAvailable"
      summary: "Check alias availability"
      description: "Returns 200 if alias is available, 404 if already taken."
      parameters:
        - name: "alias"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "applicationId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "Alias is available"
        "404":
          description: "Alias is already taken"

  /api/v1/users/check/email/{email}/application/{applicationId}:
    get:
      tags: ["users"]
      operationId: "checkEmailAvailable"
      summary: "Check email availability"
      description: "Returns 200 if email is available, 404 if already registered."
      parameters:
        - name: "email"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "email"
        - name: "applicationId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "Email is available"
        "404":
          description: "Email is already registered"

  /api/v1/users/user/{userId}:
    get:
      tags: ["users"]
      operationId: "findUserById"
      summary: "Find user by ID"
      description: "Retrieves a single user by their unique identifier."
      parameters:
        - name: "userId"
          in: "path"
          required: true
          description: "User ID"
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "User found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTO"
        "404":
          description: "User not found"

  /api/v1/users/application/{applicationId}:
    get:
      tags: ["users"]
      operationId: "findAllUsersByApplication"
      summary: "List users by application"
      description: "Returns all users belonging to the specified application."
      parameters:
        - name: "applicationId"
          in: "path"
          required: true
          description: "Application UUID"
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "User list returned"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/UserTO"
        "404":
          description: "Application not found"

  /api/v1/users/userByAlias/{alias}/application/{applicationId}:
    get:
      tags: ["users"]
      operationId: "findUserByAlias"
      summary: "Find user by alias"
      description: "Retrieves a user by alias within the given application."
      parameters:
        - name: "alias"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "applicationId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "User found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTO"
        "404":
          description: "User not found"

  /api/v1/users/alias/{alias}/application/{applicationId}:
    get:
      tags: ["users"]
      operationId: "findUserAliasByAlias"
      summary: "Find user alias record by alias"
      description: "Retrieves the compact UserAliasTO projection for the given alias and application."
      parameters:
        - name: "alias"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "applicationId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "User alias found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAliasTO"
        "404":
          description: "Alias not found"

  /api/v1/users/{userId}/full-detail:
    put:
      tags: ["users"]
      operationId: "updateUserFullDetail"
      summary: "Full update of a user"
      description: "Performs a full replacement update of the user. All writable fields must be supplied."
      parameters:
        - name: "userId"
          in: "path"
          required: true
          description: "User ID"
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserTO"
      responses:
        "200":
          description: "User updated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTO"
        "400":
          description: "Invalid user ID or payload"
        "404":
          description: "User not found"

  /api/v1/users/{userId}:
    put:
      tags: ["users"]
      operationId: "putUserDetail"
      summary: "Partial update of user details"
      description: "Partial update — only provided non-null fields are applied."
      parameters:
        - name: "userId"
          in: "path"
          required: true
          description: "User ID"
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutUserUpdateRequest"
      responses:
        "202":
          description: "User update accepted and processed"
        "400":
          description: "Invalid input parameters"
        "404":
          description: "User not found"
        "406":
          description: "User update rejected"

  /api/v1/users/unlink/user/{userId}/role/{roleId}:
    put:
      tags: ["users"]
      operationId: "unlinkRoleFromUser"
      summary: "Unlink role from user"
      description: "Removes the association between the specified user and role."
      parameters:
        - name: "userId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        - name: "roleId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "Role unlinked"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTO"
        "404":
          description: "User or role not found"

  /api/v1/users/link/user/{userId}/role/{roleId}:
    put:
      tags: ["users"]
      operationId: "linkRoleToUser"
      summary: "Link role to user"
      description: "Associates the specified role with the specified user."
      parameters:
        - name: "userId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        - name: "roleId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "Role linked"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTO"
        "404":
          description: "User or role not found"

  /api/v1/users/application/{applicationId}/user/{userId}:
    delete:
      tags: ["users"]
      operationId: "deleteUserByApplicationAndUserId"
      summary: "Delete user by application and user ID"
      description: "Permanently deletes a user identified by application ID and user ID."
      parameters:
        - name: "applicationId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        - name: "userId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "204":
          description: "User deleted successfully"
        "400":
          description: "Invalid input parameters"
        "404":
          description: "User not found"

  # ── Roles ─────────────────────────────────────────────────────────────────────

  /api/v1/roles:
    get:
      tags: ["roles"]
      operationId: "listAllRoles"
      summary: "List all roles"
      description: "Returns every role regardless of active status."
      responses:
        "200":
          description: "Role list returned"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Role"
        "404":
          description: "No roles found"

  /api/v1/roles/:
    post:
      tags: ["roles"]
      operationId: "createRole"
      summary: "Create a role"
      description: "Creates a new role and returns the persisted entity."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        "201":
          description: "Role created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          description: "Invalid role payload"

  /api/v1/roles/find/{roleId}:
    get:
      tags: ["roles"]
      operationId: "findRoleById"
      summary: "Find role by ID"
      parameters:
        - name: "roleId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "Role found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "404":
          description: "Role not found"

  /api/v1/roles/{includeInactive}:
    get:
      tags: ["roles"]
      operationId: "listRolesByStatus"
      summary: "List roles by active status"
      parameters:
        - name: "includeInactive"
          in: "path"
          required: true
          schema:
            type: "boolean"
      responses:
        "200":
          description: "Role list returned"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Role"
        "404":
          description: "No roles found"

  /api/v1/roles/{includeInactive}/{roleIds}:
    get:
      tags: ["roles"]
      operationId: "listRolesByStatusAndIds"
      summary: "List roles by status and IDs"
      parameters:
        - name: "includeInactive"
          in: "path"
          required: true
          schema:
            type: "boolean"
        - name: "roleIds"
          in: "path"
          required: true
          schema:
            type: "array"
            items:
              type: "string"
              format: "uuid"
      responses:
        "200":
          description: "Role list returned"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Role"
        "404":
          description: "No roles found"

  /api/v1/roles/{roleId}:
    put:
      tags: ["roles"]
      operationId: "updateRole"
      summary: "Update a role"
      parameters:
        - name: "roleId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        "200":
          description: "Role updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "404":
          description: "Role not found"

  /api/v1/roles/user/{userId}:
    get:
      tags: ["roles"]
      operationId: "listRolesByUser"
      summary: "List roles by user"
      parameters:
        - name: "userId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "Role list returned"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Role"
        "404":
          description: "User not found"

  # ── Features ──────────────────────────────────────────────────────────────────

  /api/v1/features/find/{featureId}:
    get:
      tags: ["features"]
      operationId: "findFeatureById"
      summary: "Find feature by ID"
      parameters:
        - name: "featureId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "Feature found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feature"
        "404":
          description: "Feature not found"

  /api/v1/features/{includeInactive}:
    get:
      tags: ["features"]
      operationId: "listFeaturesByStatus"
      summary: "List features by active status"
      parameters:
        - name: "includeInactive"
          in: "path"
          required: true
          schema:
            type: "boolean"
      responses:
        "200":
          description: "Feature list returned"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Feature"
        "404":
          description: "No features found"

  /api/v1/features/{includeInactive}/{featuresIds}:
    get:
      tags: ["features"]
      operationId: "listFeaturesByStatusAndIds"
      summary: "List features by status and IDs"
      parameters:
        - name: "includeInactive"
          in: "path"
          required: true
          schema:
            type: "boolean"
        - name: "featuresIds"
          in: "path"
          required: true
          schema:
            type: "array"
            items:
              type: "string"
      responses:
        "200":
          description: "Feature list returned"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Feature"
        "404":
          description: "No features found"

  /api/v1/features/:
    post:
      tags: ["features"]
      operationId: "createFeature"
      summary: "Create a feature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureRequest"
      responses:
        "201":
          description: "Feature created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feature"
        "406":
          description: "Feature creation not acceptable"

  /api/v1/features/{featureId}:
    put:
      tags: ["features"]
      operationId: "updateFeature"
      summary: "Update a feature"
      parameters:
        - name: "featureId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureRequest"
      responses:
        "202":
          description: "Feature update accepted"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feature"
        "406":
          description: "Feature is not registered"

  # ── Role Features ─────────────────────────────────────────────────────────────
  # NOTE: complements the existing embedded Role.features array (RoleRequest),
  # which has no per-assignment `active` flag distinct from Feature.active itself.

  /api/v1/role-features:
    post:
      tags: ["role-features"]
      operationId: "createRoleFeature"
      summary: "Assign a feature to a role"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleFeatureRequest"
      responses:
        "201":
          description: "Assignment created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleFeature"
        "400":
          description: "Invalid request body"

  /api/v1/role-features/{roleFeatureId}:
    put:
      tags: ["role-features"]
      operationId: "updateRoleFeature"
      summary: "Update a role-feature assignment (toggle active)"
      parameters:
        - name: "roleFeatureId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleFeatureRequest"
      responses:
        "200":
          description: "Assignment updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleFeature"
        "404":
          description: "Assignment not found"
    delete:
      tags: ["role-features"]
      operationId: "deleteRoleFeature"
      summary: "Remove a role-feature assignment"
      parameters:
        - name: "roleFeatureId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "Assignment removed"
        "404":
          description: "Assignment not found"

  /api/v1/role-features/role/{roleId}:
    get:
      tags: ["role-features"]
      operationId: "listRoleFeaturesByRole"
      summary: "List feature assignments for a role"
      parameters:
        - name: "roleId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "Assignment list returned"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/RoleFeature"
        "404":
          description: "Role not found"

  # ── Contacts ──────────────────────────────────────────────────────────────────

  /api/v1/contacts/:
    post:
      tags: ["contacts"]
      operationId: "createContact"
      summary: "Create a contact"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Contact"
      responses:
        "201":
          description: "Contact created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          description: "Invalid contact payload"

  /api/v1/contacts/{contactId}:
    get:
      tags: ["contacts"]
      operationId: "findContactById"
      summary: "Find contact by ID"
      parameters:
        - name: "contactId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "Contact found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "404":
          description: "Contact not found"
    put:
      tags: ["contacts"]
      operationId: "updateContact"
      summary: "Update a contact"
      parameters:
        - name: "contactId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Contact"
      responses:
        "200":
          description: "Contact updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          description: "Invalid payload"
        "404":
          description: "Contact not found"
    delete:
      tags: ["contacts"]
      operationId: "deleteContact"
      summary: "Delete a contact"
      parameters:
        - name: "contactId"
          in: "path"
          required: true
