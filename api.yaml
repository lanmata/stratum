      responses:
        "201":
          description: "Service type created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceType"
        "400":
          description: "Invalid request body"
        "409":
          description: "Service type name already in use"

  /api/v1/service-types/{serviceTypeId}:
    put:
      tags: ["service-type"]
      operationId: "updateServiceType"
      summary: "Update a service type"
      description: "Updates an existing service type by its UUID."
      parameters:
        - name: serviceTypeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceTypeRequest"
      responses:
        "202":
          description: "Service type updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceType"
        "400":
          description: "Invalid request"
        "404":
          description: "Service type not found"

# ── Components ──────────────────────────────────────────────────────────────────

components:

  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "Standard Bearer JWT token in the Authorization header"
    sessionToken:
      type: "apiKey"
      in: "header"
      name: "session-token"
      description: "Session JWT issued by the backbone-rest session service"

  schemas:

    # ── Session ─────────────────────────────────────────────────────────────

    SessionRequest:
      type: "object"
      description: "Request body for alias+password session creation"
      required: ["alias", "password", "applicationId"]
      properties:
        alias:
          type: "string"
        password:
          type: "string"
          format: "password"
        applicationId:
          type: "string"
          format: "uuid"
          description: "Target application context for the session"

    SessionEmailRequest:
      type: "object"
      description: "Request body for email+password session creation"
      required: ["email", "password", "applicationId"]
      properties:
        email:
          type: "string"
          format: "email"
        password:
          type: "string"
          format: "password"
        applicationId:
          type: "string"
          format: "uuid"

    SessionRefreshRequest:
      type: "object"
      description: "Request body to exchange a refresh token for new tokens"
      required: ["refreshToken"]
      properties:
        refreshToken:
          type: "string"

    SessionResponse:
      type: "object"
      description: "JWT access token (and optional refresh token)"
      properties:
        token:
          type: ["string", "null"]
        refreshToken:
          type: ["string", "null"]

    # ── IAM ─────────────────────────────────────────────────────────────────

    AuditEventType:
      type: "string"
      enum:
        - "LOGIN_SUCCESS"
        - "LOGIN_FAILURE"
        - "PASSWORD_CHANGE"
        - "ROLE_ASSIGNED"
        - "ROLE_REVOKED"
        - "LOGOUT"
        - "ACCOUNT_LOCKED"
        - "ACCOUNT_UNLOCKED"
        - "TOKEN_REFRESH"
        - "PASSWORD_RESET_REQUEST"
        - "CLIENT_REGISTERED"
        - "CLIENT_UPDATED"
        - "CLIENT_DEACTIVATED"
        - "CLIENT_DELETED"
        - "CLIENT_SECRET_ROTATED"
        - "CLIENT_TOKEN_ISSUED"
        - "CLIENT_TOKEN_ISSUE_FAILED"
        - "CLIENT_TOKEN_REVOKED"
        - "CLIENT_INTROSPECTION_CALLED"

    AuditEventTO:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        userId:
          type: "string"
          format: "uuid"
        applicationId:
          type: ["string", "null"]
          format: "uuid"
        eventType:
          $ref: "#/components/schemas/AuditEventType"
        ipAddress:
          type: ["string", "null"]
        userAgent:
          type: ["string", "null"]
        occurredAt:
          type: "string"
          format: "date-time"
        details:
          type: ["string", "null"]
        createdAt:
          type: "string"
          format: "date-time"

    TokenIntrospectRequest:
      type: "object"
      required: ["token"]
      properties:
        token:
          type: "string"

    TokenIntrospectResponse:
      type: "object"
      properties:
        active:
          type: "boolean"
        subject:
          type: ["string", "null"]
        issuer:
          type: ["string", "null"]
        audience:
          type: ["string", "null"]
        expiresAt:
          type: "integer"
          format: "int64"
        issuedAt:
          type: "integer"
          format: "int64"
        tokenType:
          type: ["string", "null"]
        roles:
          type: "array"
          items:
            type: "string"

    PermissionCheckRequest:
      type: "object"
      required: ["permission", "sessionToken"]
      properties:
        permission:
          type: "string"
        applicationId:
          type: ["string", "null"]
          format: "uuid"
        sessionToken:
          type: "string"

    PermissionCheckResponse:
      type: "object"
      properties:
        granted:
          type: "boolean"
        permission:
          type: "string"
        reason:
          type: ["string", "null"]

    # ── Profile Image ────────────────────────────────────────────────────────

    PostProfileImageResponse:
      type: "object"
      properties:
        ref:
          type: "string"

    GetProfileImageReferenceResponse:
      type: "object"
      properties:
        ref:
          type: "string"

    # ── Domain ───────────────────────────────────────────────────────────────

    ContactType:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        description:
          type: ["string", "null"]
        active:
          type: "boolean"

    ContactTypeRequest:
      type: "object"
      properties:
        contactType:
          $ref: "#/components/schemas/ContactType"
        dateTime:
          type: ["string", "null"]
          format: "date-time"
        appName:
          type: ["string", "null"]
        appToken:
          type: ["string", "null"]

    Person:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        firstName:
          type: "string"
        middleName:
          type: ["string", "null"]
        lastName:
          type: "string"
        gender:
          type: ["string", "null"]
        birthdate:
          type: ["string", "null"]
          format: "date"

    PersonRequest:
      type: "object"
      properties:
        person:
          $ref: "#/components/schemas/Person"
        dateTime:
          type: ["string", "null"]
          format: "date-time"
        appName:
          type: ["string", "null"]
        appToken:
          type: ["string", "null"]

    Contact:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        content:
          type: "string"
        contactType:
          $ref: "#/components/schemas/ContactType"
        person:
          $ref: "#/components/schemas/Person"
        active:
          type: "boolean"

    Feature:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        description:
          type: ["string", "null"]
        active:
          type: "boolean"
        roleIds:
          type: "array"
          description: "Existing role ids to link this feature to. Only used on creation."
          items:
            type: "string"
            format: "uuid"

    FeatureRequest:
      type: "object"
      properties:
        feature:
          $ref: "#/components/schemas/Feature"
        dateTime:
          type: ["string", "null"]
          format: "date-time"
        appName:
          type: ["string", "null"]
        appToken:
          type: ["string", "null"]

    Role:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        description:
          type: ["string", "null"]
        features:
          type: "array"
          items:
            $ref: "#/components/schemas/Feature"
        active:
          type: "boolean"

    RoleRequest:
      type: "object"
      properties:
        role:
          $ref: "#/components/schemas/Role"
        dateTime:
          type: ["string", "null"]
          format: "date-time"
        appName:
          type: ["string", "null"]
        appToken:
          type: ["string", "null"]

    Application:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        description:
          type: ["string", "null"]
        active:
          type: "boolean"
        createdDate:
          type: ["string", "null"]
          format: "date-time"
        lastUpdate:
          type: ["string", "null"]
          format: "date-time"
        serviceTypeId:
          type: ["string", "null"]
          format: "uuid"
        userList:
          type: "array"
          items:
            $ref: "#/components/schemas/User"
        roleList:
          type: "array"
          items:
            $ref: "#/components/schemas/Role"

    ApplicationCreateRequest:
      type: "object"
      properties:
        application:
          $ref: "#/components/schemas/Application"
        dateTime:
          type: ["string", "null"]
          format: "date-time"
        appName:
          type: ["string", "null"]
        appToken:
          type: ["string", "null"]

    ApplicationUpdateRequest:
      type: "object"
      required: ["application"]
      properties:
        application:
          $ref: "#/components/schemas/Application"
        dateTime:
          type: ["string", "null"]
          format: "date-time"

    User:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        alias:
          type: "string"
        password:
          type: ["string", "null"]
          format: "password"
        email:
          type: ["string", "null"]
          format: "email"
        active:
          type: "boolean"
        person:
          $ref: "#/components/schemas/Person"
        roles:
          type: "array"
          items:
            $ref: "#/components/schemas/Role"
        applications:
          type: "array"
          items:
            $ref: "#/components/schemas/Application"

    # ── User API DTOs ────────────────────────────────────────────────────────

    UserTO:
      type: "object"
      description: "Full user transfer object returned by the User API"
      properties:
        id:
          type: "string"
          format: "uuid"
        alias:
          type: "string"
        password:
          type: ["string", "null"]
          format: "password"
        email:
          type: ["string", "null"]
          format: "email"
        displayName:
          type: ["string", "null"]
        createdDate:
          type: ["string", "null"]
          format: "date-time"
        lastUpdate:
          type: ["string", "null"]
          format: "date-time"
        active:
          type: "boolean"
        notificationEmail:
          type: ["boolean", "null"]
        notificationSms:
          type: ["boolean", "null"]
        privacyDataOutActive:
          type: ["boolean", "null"]
        person:
          $ref: "#/components/schemas/Person"
        roles:
          type: "array"
          items:
            $ref: "#/components/schemas/Role"
        applications:
          type: "array"
          items:
            $ref: "#/components/schemas/Application"

    UserCreateRequest:
      type: "object"
      description: "Request payload for creating a new user"
      required: ["alias", "displayName", "password", "email", "person", "roleId", "applicationId"]
      properties:
        id:
          type: ["string", "null"]
          format: "uuid"
        alias:
          type: "string"
        displayName:
          type: "string"
        password:
          type: "string"
          format: "password"
        email:
          type: "string"
          format: "email"
        notificationEmail:
          type: "boolean"
          default: false
        notificationSms:
          type: "boolean"
          default: false
        privacyDataOutActive:
          type: "boolean"
          default: false
        active:
          type: "boolean"
          default: true
        person:
          $ref: "#/components/schemas/Person"
        roleId:
          type: "string"
          format: "uuid"
        applicationId:
          type: "string"
          format: "uuid"

    UserCreateResponse:
      type: "object"
      description: "Response returned after successfully creating a user"
      properties:
        id:
          type: "string"
          format: "uuid"
        alias:
          type: "string"
        email:
          type: "string"
          format: "email"
        displayName:
          type: ["string", "null"]
        createdDate:
          type: ["string", "null"]
          format: "date-time"
        lastUpdate:
          type: ["string", "null"]
          format: "date-time"
        notificationEmail:
          type: ["boolean", "null"]
        notificationSms:
          type: ["boolean", "null"]
        privacyDataOutActive:
          type: ["boolean", "null"]
        active:
          type: "boolean"
        personId:
          type: ["string", "null"]
          format: "uuid"
        roleId:
          type: ["string", "null"]
          format: "uuid"
        applicationId:
          type: ["string", "null"]
          format: "uuid"

    UserAliasTO:
      type: "object"
      description: "Compact user projection exposing alias and assigned roles"
      properties:
        userId:
          type: "string"
          format: "uuid"
        alias:
          type: "string"
        firstname:
          type: ["string", "null"]
        lastname:
          type: ["string", "null"]
        roles:
          type: "array"
          items:
            type: "string"
            format: "uuid"

    PutUserUpdateRequest:
      type: "object"
      description: "Partial-update request — only non-null fields are applied"
      required: ["application"]
      properties:
        application:
          type: "string"
          format: "uuid"
        password:
          type: ["string", "null"]
          format: "password"
        displayName:
          type: ["string", "null"]
        active:
          type: ["boolean", "null"]
        notificationEmail:
          type: ["boolean", "null"]
        notificationSms:
          type: ["boolean", "null"]
        privacyDataOutActive:
          type: ["boolean", "null"]
        firstName:
          type: ["string", "null"]
        middleName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        gender:
          type: ["string", "null"]
        birthdate:
          type: ["string", "null"]
          format: "date"
        contacts:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/PutUserUpdateContact"
        roleIds:
          type: ["array", "null"]
          items:
            type: "string"
            format: "uuid"

    PutUserUpdateContact:
      type: "object"
      properties:
        id:
          type: ["string", "null"]
          format: "uuid"
        content:
          type: "string"
        contactType:
          $ref: "#/components/schemas/PutUserUpdateContactType"
        active:
          type: "boolean"

    PutUserUpdateContactType:
      type: "object"
      required: ["id"]
      properties:
        id:
          type: "string"
          format: "uuid"

    # ── Legacy / Report ──────────────────────────────────────────────────────

    Void:
      type: "object"
      description: "Empty response body placeholder"

    Resource:
      type: "object"
      description: "Binary resource placeholder (report endpoints)"

    TemplateDocumentModel:
      type: "object"
      properties:
        versionId:
          type: ["integer", "null"]
          format: "int64"
        templateName:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        createdBy:
          type: ["string", "null"]
        createdTimestamp:
          type: ["string", "null"]
          format: "date"
        lastModifiedBy:
          type: ["string", "null"]
        lastModifiedTimestamp:
          type: ["string", "null"]
          format: "date"

    # ── Managed Clients ──────────────────────────────────────────────────────

    ManagedClientCreateRequest:
      type: object
      required: [name, applicationId, scopes]
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 512
        applicationId:
          type: string
          format: uuid
        scopes:
          type: array
          items:
            type: string
          minItems: 1
        active:
          type: boolean
          default: true

    ManagedClientCreateResponse:
      type: object
      properties:
        clientId:
          type: string
          format: uuid
        clientSecret:
          type: string
          description: Plaintext secret — returned exactly once. Store immediately and securely.
        name:
          type: string
        applicationId:
          type: string
          format: uuid
        scopes:
          type: array
          items:
            type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ManagedClientTO:
      type: object
      description: Read-only view of a managed client. Never contains secret material.
      properties:
        clientId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        applicationId:
          type: string
          format: uuid
        scopes:
          type: array
          items:
            type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastUpdatedAt:
          type: string
          format: date-time
        secretLastRotatedAt:
          type: string
          format: date-time

    ManagedClientUpdateRequest:
      type: object
      description: All fields optional — only provided fields are updated.
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 512
        scopes:
          type: array
          items:
            type: string
        active:
          type: boolean

    ManagedClientTokenRequest:
      type: object
      required: [clientId, clientSecret, scopes]
      properties:
        clientId:
          type: string
          format: uuid
        clientSecret:
          type: string
        scopes:
          type: array
          items:
            type: string
          minItems: 1

    ManagedClientTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: Signed RS256 M2M JWT
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Token TTL in seconds
        scopes:
          type: array
          items:
            type: string
        issuedAt:
          type: string
          format: date-time

    ManagedClientSecretRotateResponse:
      type: object
      properties:
        clientId:
          type: string
          format: uuid
        clientSecret:
          type: string
          description: New plaintext secret — returned exactly once. Store immediately and securely.
        gracePeriodSeconds:
          type: integer
          description: Seconds the old secret remains valid
        rotatedAt:
          type: string
          format: date-time

    ManagedClientTokenIntrospectResponse:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
        clientId:
          type: string
        clientName:
          type: string
        scopes:
          type: array
          items:
            type: string
        issuer:
          type: string
        exp:
          type: integer
          format: int64
        iat:
          type: integer
          format: int64
        jti:
          type: string

    ManagedClientErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: invalid_client
        errorDescription:
          type: string
        clientId:
          type: string

    ServiceType:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 512
        active:
          type: boolean

    ServiceTypeRequest:
      type: object
      properties:
        serviceType:
          $ref: "#/components/schemas/ServiceType"
